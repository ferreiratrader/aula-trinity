<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trinity — A aula de hoje</title>
<meta name="description" content="A aula de hoje da Trinity. No ar somente até a próxima ser liberada.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- ═══════════════════════════════════════════════════════════════════
     AULA DE HOJE — a cada envio, edite 2 campos: videoId e numero
     ═══════════════════════════════════════════════════════════════════ -->
<script>
const AULA = {
  // ID do vídeo no YouTube (o que vem depois de "v=" no link).
  // Ex.: https://youtube.com/watch?v=dQw4w9WgXcQ  →  videoId: "dQw4w9WgXcQ"
  // Suba o vídeo como "não listado". Deixe "" para o estado de espera.
  videoId: "-zuxrMjpAr0",

  // Número desta aula na jornada (só cresce: 1, 2, 3…)
  numero: 1,

  // Link do grupo (Telegram/WhatsApp) — configura uma vez só
  linkGrupo: "#"
};
</script>

<style>
:root{
  --bg:#0b0a08;
  --line:#2a251c;
  --text:#f2efe8;
  --muted:#948f85;
  --ouro-claro:#f6dd8a;
  --ouro:#d4a03c;
  --ouro-escuro:#8f6a1e;
  --alerta:#d38d55;
  --display:'Archivo',system-ui,sans-serif;
  --sans:'Archivo',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-variation-settings:'wdth' 100;
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  text-align:center;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}
a:focus-visible,button:focus-visible{outline:1px solid var(--ouro);outline-offset:4px}

/* ── fundo com profundidade: thumbnail da aula borrada + vinheta ── */
.fundo{
  position:fixed;inset:-40px;z-index:-2;
  background-size:cover;background-position:center;
  filter:blur(42px) saturate(.85) brightness(.5);
  transform:scale(1.1);
}
.fundo::after{content:'';position:absolute;inset:0}
.vinheta{
  position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(ellipse 90% 60% at 50% 0%, rgba(212,160,60,.10), transparent 60%),
    radial-gradient(ellipse 120% 90% at 50% 55%, transparent 30%, rgba(11,10,8,.92) 78%),
    linear-gradient(rgba(11,10,8,.55), rgba(11,10,8,.82));
}

.wrap{width:100%;max-width:1000px;margin:0 auto;padding:0 24px}

/* tipografia de apoio */
.label{
  font-family:var(--mono);
  font-size:.68rem;
  font-weight:500;
  letter-spacing:.32em;
  text-transform:uppercase;
  color:var(--muted);
}
.label.ouro{color:var(--ouro)}

/* ── cabeçalho / marca ── */
header{padding:44px 0 0}
.marca{
  font-family:var(--display);
  font-style:italic;font-weight:900;
  font-variation-settings:'wdth' 78;
  font-size:2rem;letter-spacing:.04em;text-transform:uppercase;
  line-height:1;
}
.marca small{
  display:block;
  font-family:var(--mono);font-style:normal;font-weight:500;
  font-size:.62rem;letter-spacing:.58em;text-indent:.58em;
  color:var(--ouro);margin-top:8px;
}

/* ── a aula de hoje ── */
main{flex:1;display:flex;align-items:center}
.hoje{padding:40px 0 56px}

/* ── player com moldura dourada e brilho ── */
.player{
  position:relative;aspect-ratio:16/9;
  background:#080705;
  border:1px solid rgba(212,160,60,.55);
  border-radius:14px;
  overflow:hidden;
  box-shadow:
    0 0 0 1px rgba(212,160,60,.12),
    0 0 46px rgba(212,160,60,.16),
    0 30px 70px -30px rgba(0,0,0,.85);
}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* capa própria — o YouTube só carrega depois do clique, já tocando */
.capa{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background-size:cover;background-position:center;
  cursor:pointer;border:0;padding:0;
}
.capa::before{content:'';position:absolute;inset:0;background:rgba(8,7,5,.5)}
.capa .play{
  position:relative;
  width:96px;height:96px;border-radius:50%;
  border:2px solid var(--ouro);
  background:radial-gradient(circle at 35% 30%, rgba(246,221,138,.25), rgba(11,10,8,.55));
  box-shadow:0 0 34px rgba(212,160,60,.35);
  display:flex;align-items:center;justify-content:center;
  transition:transform .25s ease,box-shadow .25s ease,background .25s ease;
}
.capa .play svg{margin-left:6px}
.capa:hover .play{
  transform:scale(1.06);
  box-shadow:0 0 54px rgba(212,160,60,.55);
  background:linear-gradient(180deg, var(--ouro-claro), var(--ouro));
}
.capa:hover .play svg path{fill:#0b0a08}
.espera{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:24px;
}
.espera p{color:var(--muted);font-size:.85rem;max-width:34ch}

/* ── aviso de urgência ── */
.regra{
  margin:34px auto 0;
  max-width:660px;
  padding:22px 28px;
  border:1px solid rgba(211,141,85,.5);
  background:rgba(211,141,85,.06);
  border-radius:10px;
  font-size:.9rem;
  color:var(--muted);
  box-shadow:0 0 30px rgba(211,141,85,.08);
}
.regra b{
  display:block;
  font-family:var(--mono);
  font-weight:500;
  font-size:.74rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--alerta);
  margin-bottom:10px;
}

/* ── botão do grupo ── */
.cta{
  display:inline-block;margin-top:40px;text-decoration:none;
  font-family:var(--display);font-style:italic;font-weight:800;
  font-variation-settings:'wdth' 80;
  font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;
  color:#171204;
  background:linear-gradient(180deg, var(--ouro-claro), var(--ouro) 70%, #b98a2e);
  border-radius:8px;
  padding:16px 40px;
  box-shadow:0 0 30px rgba(212,160,60,.28), 0 12px 28px -14px rgba(0,0,0,.8);
  transition:transform .2s ease,box-shadow .2s ease;
}
.cta:hover{transform:translateY(-2px);box-shadow:0 0 46px rgba(212,160,60,.45), 0 16px 30px -14px rgba(0,0,0,.8)}

/* ── rodapé ── */
footer{padding:0 0 40px}
footer .label{letter-spacing:.32em}

/* entrada sutil */
@media (prefers-reduced-motion:no-preference){
  header,.hoje,footer{animation:surgir .9s ease both}
  .hoje{animation-delay:.08s}
  footer{animation-delay:.16s}
  @keyframes surgir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}

@media (max-width:560px){
  header{padding-top:32px}
  .hoje{padding:32px 0 44px}
  .marca{font-size:1.6rem}
  h1{margin-bottom:28px}
  .capa .play{width:76px;height:76px}
  .regra{padding:18px 20px}
}
</style>
</head>
<body>

<div class="fundo" id="fundo"></div>
<div class="vinheta"></div>

<header>
  <div class="marca">Trinity<small>TRADER</small></div>
</header>

<main>
  <div class="wrap">
    <div class="hoje">
      <div class="player" id="player"></div>

      <p class="regra">
        <b>Esta aula não fica disponível de forma permanente</b>
        Cada conteúdo é liberado por tempo limitado e substituído pela próxima aula.
      </p>

      <a class="cta" id="grupo" href="#">Voltar pro grupo</a>
    </div>
  </div>
</main>

<footer>
  <span class="label">UMA AULA POR VEZ · UM AVANÇO POR DIA</span>
</footer>

<script>
// número da aula (usado no estado de espera e no título do player)
const num = String(AULA.numero).padStart(2, '0');

document.getElementById('grupo').href = AULA.linkGrupo;

const player = document.getElementById('player');
if (AULA.videoId) {
  // o fundo da página é a thumbnail da própria aula, borrada e escurecida
  document.getElementById('fundo').style.backgroundImage =
    'url(https://i.ytimg.com/vi/' + AULA.videoId + '/maxresdefault.jpg), ' +
    'url(https://i.ytimg.com/vi/' + AULA.videoId + '/hqdefault.jpg)';

  // capa própria: o player do YouTube (com título, canal, compartilhar…)
  // só é carregado no clique, e já entra tocando — sem poluição antes do play
  const capa = document.createElement('button');
  capa.className = 'capa';
  capa.setAttribute('aria-label', 'Assistir a aula de hoje');
  capa.style.backgroundImage =
    'url(https://i.ytimg.com/vi/' + AULA.videoId + '/maxresdefault.jpg), ' +
    'url(https://i.ytimg.com/vi/' + AULA.videoId + '/hqdefault.jpg)';
  capa.innerHTML = '<span class="play"><svg width="30" height="34" viewBox="0 0 26 30" aria-hidden="true"><path d="M2 2 L24 15 L2 28 Z" fill="#f6dd8a"/></svg></span>';
  capa.addEventListener('click', () => {
    player.innerHTML = '<iframe src="https://www.youtube.com/embed/' + AULA.videoId +
      '?autoplay=1&rel=0&iv_load_policy=3&playsinline=1&fs=1" title="Aula ' + num + ' — Trinity"' +
      ' allow="accelerometer; autoplay; clipboard-write; encrypted-media; fullscreen; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';
  });
  player.appendChild(capa);
} else {
  player.innerHTML = '<div class="espera">' +
    '<span class="label ouro">Aula ' + num + ' · em preparação</span>' +
    '<p>Fica de olho no grupo — o aviso chega lá assim que o vídeo entrar no ar.</p>' +
    '</div>';
}
</script>

</body>
</html>
